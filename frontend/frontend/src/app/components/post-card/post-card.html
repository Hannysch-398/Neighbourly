<a
  class="post-list-item"
  [class.post-list-item--urgent]="post.isUrgent"
  [routerLink]="['/posts', post.id]"
  [attr.aria-label]="'Beitrag ' + post.title + ' öffnen'"
  role="listitem"
>
  <div class="post-main">
    <div class="post-title-row">
      <h2>{{ post.title }}</h2>

      @if (post.isUrgent) {
        <span class="urgent-badge">Dringend</span>
      }
    </div>

    <p class="post-description">{{ post.description }}</p>

    <div class="post-meta">
      <span>{{ post.type }}</span>
      <span>{{ post.postMode }}</span>
      <span>{{ post.createdAt | date: 'dd.MM.yyyy' }}</span>
    </div>
  </div>

  <div class="post-status">
    <span>{{ post.status }}</span>
  </div>
</a>
