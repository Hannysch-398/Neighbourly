<section class="posts-list-page">
  <main class="posts-list-shell" aria-live="polite">
    @if (isLoading()) {
      <div class="posts-list" aria-label="Beiträge werden geladen">
        @for (item of [1, 2, 3]; track item) {
          <article class="post-list-skeleton">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line skeleton-description"></div>
            <div class="skeleton-meta">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </article>
        }
      </div>
    } @else if (errorMessage()) {
      <div class="list-state error-state">
        <h2>Laden fehlgeschlagen</h2>
        <p>{{ errorMessage() }}</p>
        <button type="button" class="retry-button" (click)="loadPosts()">Erneut versuchen</button>
      </div>
    } @else if (!hasPosts()) {
      <div class="list-state">
        <h2>Keine Beiträge vorhanden</h2>
        <p>Aktuell gibt es keine Beiträge.</p>
      </div>
    } @else {
      <div class="posts-list" role="list">
        @for (post of posts(); track post.id) {
          <app-post-card [post]="post"></app-post-card>
        }
      </div>
    }
  </main>
</section>
