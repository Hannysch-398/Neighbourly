<aside class="map-overlay" [class.open]="isOpen">
  <button type="button" class="burger-button" (click)="toggleOverlay.emit()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  @if (isOpen) {
    <div class="overlay-content">
      <!-- später Inhalt -->

      @for (post of posts(); track post.id) {
        <app-sidebar-entry
          [post]="post"
          [class.selected]="selectedPost()?.id === post.id"
          (click)="postService.selectMapPost(post)"
          (selectPost)="selectPost($event)"
          [selected]="selectedPost()?.id === post.id"
        ></app-sidebar-entry>
      }</div>
  }
</aside>
